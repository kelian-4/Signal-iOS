name: Messagerie
options:
  bundleIdPrefix: cm.messagerie
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  MeshCore:
    path: ../MeshCore
targets:
  Messagerie:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: MeshCore
        product: MeshCore
      - package: MeshCore
        product: MeshBLE
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Messagerie
        CFBundleDevelopmentRegion: fr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - bluetooth-le
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        NSBluetoothAlwaysUsageDescription: Messagerie utilise le Bluetooth pour échanger des messages avec les appareils proches, sans Internet.
        NSBluetoothPeripheralUsageDescription: Messagerie utilise le Bluetooth pour être visible des appareils proches.
        NSCameraUsageDescription: La caméra sert uniquement à scanner le code QR d'un contact en personne.
        UIFileSharingEnabled: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cm.messagerie.app
        PRODUCT_NAME: Messagerie
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
schemes:
  Messagerie:
    build:
      targets:
        Messagerie: all
    run:
      config: Debug
    archive:
      config: Release
