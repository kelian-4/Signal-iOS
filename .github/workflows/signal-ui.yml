name: signal-ui
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Resolve packages
        id: resolve
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -workspace Signal.xcworkspace -scheme Signal 2>&1 | tee "$RUNNER_TEMP/resolve.log" | tail -n 30
      - name: Build Signal scheme for device without signing
        id: build
        run: |
          set -o pipefail
          xcodebuild build -workspace Signal.xcworkspace -scheme Signal \
            -configuration Debug -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 40
      - name: Write ci-statut-signal.md
        if: always()
        env:
          RESOLVE: ${{ steps.resolve.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          {
            echo "# Statut CI (signal-ui)"
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- run: ${GITHUB_RUN_ID}"
            echo "- resolve: ${RESOLVE}"
            echo "- build: ${BUILD}"
            for f in resolve build; do
              if [ -f "$RUNNER_TEMP/$f.log" ]; then
                echo
                echo "## $f: erreurs"
                echo '```'
                grep -E "error:|error •|fatal|Fatal" "$RUNNER_TEMP/$f.log" | sort -u | head -n 80
                echo '---'
                tail -n 15 "$RUNNER_TEMP/$f.log"
                echo '```'
              fi
            done
          } > ci-statut-signal.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ci-statut-signal.md
          git commit -m "ci: statut signal-ui ${GITHUB_RUN_ID} [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
