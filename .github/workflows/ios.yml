name: ios
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - name: Package tests (frames, outbox, relay, QR, phrase, backup, service)
        id: tests
        working-directory: MeshCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/tests.log" | tail -n 80
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Build Signal for device without signing
        id: build
        timeout-minutes: 120
        run: |
          set -o pipefail
          xcodebuild build -workspace Signal.xcworkspace -scheme Signal \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 60
      - name: Package unsigned .ipa
        id: package
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          rm -rf Payload Messagerie.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Messagerie.ipa Payload
          ls -la Messagerie.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: messagerie-unsigned-ipa
          path: Messagerie.ipa
      - name: Publish pre-release for SideStore
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Messagerie.ipa \
            --prerelease --target "${{ github.sha }}" \
            --title "iOS build ${{ github.run_number }}" \
            --notes "Unsigned .ipa for SideStore (commit ${{ github.sha }})."
      - name: Write ci-statut.md to the repository
        if: always() && github.event_name != 'pull_request'
        env:
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          JOB: ${{ job.status }}
        run: |
          {
            echo "# Statut CI (ios)"
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- run: ${GITHUB_RUN_ID} (build-${GITHUB_RUN_NUMBER})"
            echo "- date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- résultat: ${JOB}"
            echo "- swift test: ${TESTS}"
            echo "- xcodebuild: ${BUILD}"
            echo "- ipa: ${PACKAGE}"
            for f in tests build; do
              if [ -f "$RUNNER_TEMP/$f.log" ]; then
                echo
                echo "## fin du log $f (erreurs et dernières lignes)"
                echo '```'
                grep -E "error:|error •|failed|Fatal" "$RUNNER_TEMP/$f.log" | head -n 40
                echo '---'
                tail -n 25 "$RUNNER_TEMP/$f.log"
                echo '```'
              fi
            done
          } > ci-statut.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ci-statut.md
          git commit -m "ci: statut du run ${GITHUB_RUN_ID} [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
